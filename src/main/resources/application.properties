spring.application.name=nocode-platform
server.address=0.0.0.0
server.port=8080
server.forward-headers-strategy=framework

#############################################
# LOCAL POSTGRES DATABASE
#############################################
spring.datasource.url=jdbc:postgresql://localhost:5432/qcollect

spring.datasource.username=postgres
spring.datasource.password=mahimahi
spring.datasource.driver-class-name=org.postgresql.Driver
#file.upload-dir=uploads
#############################################
# JPA
#############################################
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

#############################################
# FLYWAY
#############################################
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

#############################################
# SWAGGER
#############################################
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

#############################################
# JWT
#############################################
jwt.secret=ZTBjN2ZhM2QxNDQ2ODQ3OTUxM2FlNTg4N2JkYzRjZjAxMjM0NTY3ODlhYmNkZWYwMTIzNDU2Nzg5YWJjZA==
jwt.expiration=86400000

#############################################
# FILE UPLOAD + SYNC
#############################################
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
file.upload-dir=uploads/submissions
queue.sync.delay=30000

#############################################
# LOGGING
#############################################
logging.level.org.springframework.security=DEBUG
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=yourgmail@gmail.com
spring.mail.password=YOUR_APP_PASSWORD

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#############################################
# CLOUDINARY IMAGE STORAGE
#############################################
cloudinary.url=${CLOUDINARY_URL:}
cloudinary.folder=${CLOUDINARY_FOLDER:qcollect}
cloudinary.max-image-size-bytes=${CLOUDINARY_MAX_IMAGE_SIZE_BYTES:15728640}
